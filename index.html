/* Advising-slip time patterns: "MW 11:50AM-1:20PM", "S 11:50AM-2:50PM", "TR 1:30PM-3:00PM" */
function parseAdvisingTime(raw, dayMap){
  if(!raw) return null;
  const s = String(raw).replace(/\s+/g,' ').trim();
  const dayLetters = Object.keys(dayMap||DEFAULT_DAY_MAP).join('');
  const re = new RegExp(
    '\\b(['+dayLetters+']{1,4})\\s*(\\d{1,2}:\\d{2}\\s*[APap][Mm])\\s*[-–—]\\s*(\\d{1,2}:\\d{2}\\s*[APap][Mm])',
    'i'
  );
  const m = re.exec(s);
  if(!m) return null;
  const letters = m[1].toUpperCase().split('');
  const start = parseTimeToMinutes(m[2]);
  const end = parseTimeToMinutes(m[3]);
  if(start===null || end===null || end<=start) return null;
  const meetings = [];
  for(const L of letters){
    const day = (dayMap||DEFAULT_DAY_MAP)[L];
    if(day) meetings.push({ day, start, end, room: null });
  }
  return meetings.length ? meetings : null;
}

function parseAdvisingRows(rows, dayMap){
  // rows: array of {course, section, credits, time, room, remarks}
  const items = [];
  let lastCourse = null;
  for(const r of rows){
    const remarks = (r.remarks||'').toLowerCase();
    if(remarks.includes('dropped')) continue;
    let course = (r.course||'').toString().trim();
    let section = r.section!=null && r.section!=='' ? String(r.section).trim() : null;
    let timeStr = (r.time||'').toString().trim();
    let room = (r.room||'').toString().trim() || null;
    // Lab continuation rows sometimes shift columns
    if(!course && lastCourse && timeStr){
      course = lastCourse + (/\blab\b/i.test(timeStr)?'':' Lab');
    }
    // Detect if "course" cell actually holds a time (shifted lab row)
    if(course && !timeStr && parseAdvisingTime(course, dayMap)){
      timeStr = course;
      course = lastCourse ? (lastCourse.match(/Lab$/i) ? lastCourse : lastCourse + ' Lab') : 'Lab';
    }
    // Another shift: section cell holds time
    if(!timeStr && section && parseAdvisingTime(section, dayMap)){
      timeStr = section;
      section = null;
    }
    if(!course || !timeStr) continue;
    if(/tuition|laboratory fee|student activity|grand total|bank /i.test(course)) continue;
    const meetings = parseAdvisingTime(timeStr, dayMap);
    if(!meetings) continue;
    if(room) meetings.forEach(m=>{ m.room = room; });
    const code = course.replace(/\s+/g,' ').trim();
    items.push({
      courseCode: code,
      sectionNumber: section || '—',
      credits: r.credits!=null && r.credits!=='' ? r.credits : null,
      meetings
    });
    lastCourse = code.replace(/\s+Lab$/i,'');
  }
  return items;
}

async function parseAdvisingPdf(file, dayMap){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5]}));
    items.sort((a,b)=> b.y-a.y || a.x-b.x);
    let line = null, linesBuf = [];
    for(const it of items){
      if(line && Math.abs(it.y-line.y)<=3){ line.parts.push(it); }
      else { if(line) linesBuf.push(line); line = {y:it.y, parts:[it]}; }
    }
    if(line) linesBuf.push(line);
    for(const ln of linesBuf){
      ln.parts.sort((a,b)=>a.x-b.x);
      fullText += ln.parts.map(p=>p.str).join(' ').replace(/\s+/g,' ').trim() + '\n';
    }
  }
  const meta = {};
  const nameM = /Name:\s*([A-Za-z .]+?)(?:\s+ID#|\s*$)/im.exec(fullText);
  if(nameM) meta.studentName = nameM[1].trim();
  const idM = /ID#\s*([\d\-]+)/i.exec(fullText);
  if(idM) meta.studentId = idM[1].trim();
  const semM = /(Spring|Summer|Fall|Autumn)[\s\-]*20\d{2}/i.exec(fullText);
  if(semM) meta.semester = semM[0];

  // Stop at bank copy / fee section to avoid noise
  const cut = fullText.search(/\bTuition Fee\b|\bGrand Total\b|\bBank Copy\b/i);
  const body = cut > 0 ? fullText.slice(0, cut) : fullText;
  const lines = body.split('\n').map(l=>l.trim()).filter(Boolean);

  const dayLetters = Object.keys(dayMap||DEFAULT_DAY_MAP).join('');
  const timeRe = new RegExp(
    '(['+dayLetters+']{1,4})\\s*(\\d{1,2}:\\d{2}\\s*[APap][Mm])\\s*[-–—]\\s*(\\d{1,2}:\\d{2}\\s*[APap][Mm])',
    'gi'
  );
  const courseOnlyRe = /\b([A-Z]{2,5}\d{3,4}[A-Z]?(?:\s+Lab)?)\b/;

  // Walk lines; attach multi-line times/rooms to the current course block
  const items = [];
  let cur = null;

  function flush(){
    if(cur && cur.meetings.length){
      items.push({
        courseCode: cur.course,
        sectionNumber: cur.section || '—',
        credits: cur.credits,
        meetings: cur.meetings
      });
    }
    cur = null;
  }

  function extractTimesAndRooms(text){
    const found = [];
    timeRe.lastIndex = 0;
    let m;
    while((m = timeRe.exec(text))){
      const letters = m[1].toUpperCase().split('');
      const start = parseTimeToMinutes(m[2]);
      const end = parseTimeToMinutes(m[3]);
      if(start===null || end===null || end<=start) continue;
      // Room: text after this match until next time or end
      const after = text.slice(m.index + m[0].length);
      const nextTime = after.search(new RegExp('['+dayLetters+']{1,4}\\s*\\d{1,2}:\\d{2}','i'));
      let roomChunk = (nextTime >= 0 ? after.slice(0, nextTime) : after).replace(/\s+/g,' ').trim();
      roomChunk = roomChunk.replace(/^\d{4,}\.?\d*\s*/,'').trim(); // tuition
      roomChunk = roomChunk.replace(/\bDropped\b.*/i,'').trim();
      let room = cleanRoomString(roomChunk);
      if(!room && roomChunk){
        const rm = roomChunk.match(/([A-Z]{1,4}\d{0,2}[-–]?\d{1,4}|\b\d{2,4}\b)/i);
        if(rm) room = rm[1];
      }
      for(const L of letters){
        const day = (dayMap||DEFAULT_DAY_MAP)[L];
        if(day) found.push({ day, start, end, room });
      }
    }
    return found;
  }

  for(const line of lines){
    if(/tuition|grand total|laboratory fee|student activity|name:|id#|course\(s\)|remarks/i.test(line)) continue;
    const cm = courseOnlyRe.exec(line);
    if(cm && !/fee|bank|total/i.test(line)){
      // New course block
      const course = cm[1].replace(/\s+/g,' ').trim();
      // Lab continuation without repeating parent code in a weird way
      if(/\bLab\b/i.test(course) && cur && !/\bLab\b/i.test(cur.course)){
        // e.g. line is "CSE251 Lab ..." while cur is CSE251 → finish theory, start lab
        flush();
      } else if(cur && cur.course.replace(/\s+Lab$/i,'') === course.replace(/\s+Lab$/i,'') && /\bLab\b/i.test(course)){
        flush();
      } else if(cm.index < 40){
        // Course at start of line → new block
        flush();
      } else {
        // Course code mid-line noise — still try times on this line for current
        if(cur){
          extractTimesAndRooms(line).forEach(mt=> cur.meetings.push(mt));
        }
        continue;
      }
      const rest = line.slice(cm.index + cm[0].length);
      let section = null, credits = null;
      const after = rest.trim().split(/\s+/);
      for(const tok of after){
        if(section===null && /^\d{1,3}$/.test(tok)){ section = tok; continue; }
        if(credits===null && /^\d+(\.\d+)?$/.test(tok) && parseFloat(tok)<=6){ credits = tok; continue; }
        break;
      }
      cur = { course, section, credits, meetings: extractTimesAndRooms(line) };
      continue;
    }
    // Continuation line (time / room only)
    if(cur){
      const more = extractTimesAndRooms(line);
      if(more.length){
        more.forEach(mt=> cur.meetings.push(mt));
      } else if(cur.meetings.length){
        // Room-only continuation under a recent meeting
        const maybe = cleanRoomString(line) || (line.match(/([A-Z]{1,4}\d{0,2}[-–]?\d{1,4}|\b\d{2,4}\b)/i)||[])[1];
        if(maybe && !cur.meetings[cur.meetings.length-1].room){
          cur.meetings[cur.meetings.length-1].room = maybe;
        }
      }
    }
  }
  flush();

  // Deduplicate meetings
  for(const it of items){
    const seen = new Set();
    it.meetings = it.meetings.filter(m=>{
      const k = m.day+'|'+m.start+'|'+m.end+'|'+(m.room||'');
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }
  return { items: items.filter(it=>it.meetings.length), meta };
}

async function parseAdvisingExcel(file, dayMap){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  const meta = {};
  // Scan for name / id / semester
  for(const row of aoa.slice(0,30)){
    const cells = row.map(c=>String(c||'').trim()).filter(Boolean);
    const joined = cells.join(' | ');
    if(/Name:/i.test(joined)){
      const idx = cells.findIndex(c=>/Name:/i.test(c));
      if(idx>=0 && cells[idx+1]) meta.studentName = cells[idx+1].replace(/Name:\s*/i,'').trim();
      else {
        const m = /Name:\s*(.+)/i.exec(joined);
        if(m) meta.studentName = m[1].split('|')[0].trim();
      }
    }
    if(/ID#/i.test(joined)){
      const m = /ID#\s*([\d\-]+)/i.exec(joined);
      if(m) meta.studentId = m[1];
    }
    if(/(Spring|Summer|Fall|Autumn)[\s\-]*20\d{2}/i.test(joined)){
      const m = /(Spring|Summer|Fall|Autumn)[\s\-]*20\d{2}/i.exec(joined);
      if(m) meta.semester = m[0];
    }
  }
  // Find header row with Course / Time
  let headerIdx = -1;
  for(let i=0;i<Math.min(aoa.length,40);i++){
    const row = aoa[i].map(c=>String(c||'').toLowerCase());
    if(row.some(c=>c.includes('course')) && row.some(c=>c.includes('time')||c.includes('weekday'))){
      headerIdx = i; break;
    }
  }
  const rows = [];
  const start = headerIdx>=0 ? headerIdx+1 : 0;
  for(let i=start;i<aoa.length;i++){
    const raw = aoa[i].map(c=> c==null?'':c);
    const cells = raw.map(c=>String(c).trim());
    if(!cells.some(Boolean)) continue;
    const joined = cells.join(' ');
    if(/tuition fee|laboratory fee|grand total|student activity|bank asia|authorized signature/i.test(joined)) break;
    // Find course-like cell
    let course=null, section=null, credits=null, time=null, room=null, remarks='';
    for(let j=0;j<cells.length;j++){
      const c = cells[j];
      if(!course && /^[A-Z]{2,5}\d{3,4}[A-Z]?(?:\s+Lab)?$/i.test(c)){ course = c; continue; }
      if(course && section===null && /^\d{1,3}$/.test(c)){ section = c; continue; }
      if(course && credits===null && /^\d+(\.\d+)?$/.test(c) && parseFloat(c)<=6){ credits = c; continue; }
      if(!time && parseAdvisingTime(c, dayMap)){ time = c; continue; }
      if(time && !room && c && !/^\d+(\.\d+)?$/.test(c) && !/^dropped/i.test(c)){ room = c; continue; }
      if(/dropped/i.test(c)) remarks = c;
    }
    // Shifted lab rows: first non-empty might be time
    if(!course && time){
      // leave for parseAdvisingRows continuation logic — need last course
      rows.push({ course:'', section, credits, time, room, remarks });
      continue;
    }
    if(course) rows.push({ course, section, credits, time, room, remarks });
  }
  return { items: parseAdvisingRows(rows, dayMap), meta };
}

async function handleRoutineFile(file){
  const name = (file.name||'').toLowerCase();
  const isPdf = file.type==='application/pdf' || name.endsWith('.pdf');
  const isXls = name.endsWith('.xlsx') || name.endsWith('.xls') || /sheet|excel/i.test(file.type||'');
  if(!isPdf && !isXls){
    toast('Please upload a PDF or Excel (.xlsx) advising slip.','error');
    return;
  }
  try{
    toast('Reading advising slip…');
    const parsed = isPdf
      ? await parseAdvisingPdf(file, Store.dayMap)
      : await parseAdvisingExcel(file, Store.dayMap);
    routineState.items = parsed.items;
    routineState.meta = parsed.meta;
    routineState.fileName = file.name;
    toast(`Routine built · ${parsed.items.length} course${parsed.items.length===1?'':'s'}.`,'success');
    render();
  }catch(err){
    console.error(err);
    toast('Could not read this file. '+ (err.message||''),'error');
  }
}

/* ---- Compare ---- */
function renderCompare(){
  const options = Store.schedules;
  if(options.length<1){
    return `<div class="page-header"><div><h1>Compare Schedules</h1><div class="sub">Line up your drafts side by side before you register.</div></div></div>
      ${renderEmptyState('Nothing to compare yet','Create at least one schedule first.')}`;
  }
  const cards = options.map(s=>{
    const st = Conflicts.scheduleStats(s);
    const gaps = dailyGapStats(s);
    const gapDays = DAY_ORDER.filter(d=>gaps[d]&&gaps[d].shortest!=null);
    const avgShort = gapDays.length ? Math.round(gapDays.reduce((a,d)=>a+gaps[d].shortest,0)/gapDays.length) : null;
    return { s, st, avgShort, gaps };
  });
  // Best values for highlighting
  const minDays = Math.min(...cards.map(c=>c.st.daysUsed||99));
  const minHours = Math.min(...cards.map(c=>c.st.totalMinutes||9e9));
  const minConflicts = Math.min(...cards.map(c=>c.st.conflicts||0));
  const earliestBest = Math.max(...cards.map(c=>c.st.earliest!=null?c.st.earliest:-1)); // later start is often preferred

  return `
  <div class="page-header"><div><h1>Compare Schedules</h1><div class="sub">Pick the draft that fits your week best. Green values are generally better.</div></div></div>
  <div class="compare-grid">
    ${cards.map(({s,st,avgShort})=>{
      const metric = (label, val, good)=>{
        return `<div class="compare-metric ${good?'best':''}"><span class="label">${label}</span><span class="val">${val}</span></div>`;
      };
      return `<div class="card compare-card">
        <h3>${escapeHtml(s.name)}</h3>
        <div class="sub mono" style="margin-top:-6px;">${s.items.map(i=>i.courseCode+' §'+i.sectionNumber).join(' · ')||'Empty'}</div>
        ${metric('Courses', s.items.length+'/5', false)}
        ${metric('Days on campus', st.daysUsed, st.daysUsed===minDays)}
        ${metric('Weekly hours', (st.totalMinutes/60).toFixed(1)+'h', st.totalMinutes===minHours)}
        ${metric('Conflicts', st.conflicts, st.conflicts===minConflicts && st.conflicts===0)}
        ${metric('Friday classes', st.fridayCount, st.fridayCount===0)}
        ${metric('Earliest class', st.earliest!=null?formatMinutes(st.earliest):'—', st.earliest===earliestBest)}
        ${metric('Latest class', st.latest!=null?formatMinutes(st.latest):'—', false)}
        ${metric('Avg. shortest gap', formatGapMinutes(avgShort), false)}
        <button class="btn btn-sm" style="margin-top:8px;" data-view-schedule="${s.id}">Open schedule</button>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------------- 8. EVENT WIRING ---------------------- */

function navigate(route, param){
  Store.route = route;
  Store.routeParam = param || null;
  render();
  window.scrollTo(0,0);
}

function applyTheme(theme){
  if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}

function wireGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const focusId = el.getAttribute('data-schedule-focus');
      navigate(el.getAttribute('data-nav'), focusId? {detailId:focusId} : null);
    });
  });

  const gsearch = document.getElementById('global-search-input');
  if(gsearch){
    gsearch.addEventListener('input', debounce(e=>{
      courseFilters.q = e.target.value;
      navigate('courses', {q:e.target.value});
    }, 220));
    gsearch.addEventListener('keydown', e=>{ if(e.key==='Enter'){ courseFilters.q=e.target.value; navigate('courses',{q:e.target.value}); }});
  }

  const themeBtn = document.getElementById('theme-toggle');
  if(themeBtn){
    themeBtn.addEventListener('click', async ()=>{
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try{ await Persist.set('ui:theme', next); }catch(e){}
    });
  }

  wireUploadEvents();
  wireCoursesEvents();
  wireScheduleRailEvents();
  wireSchedulesPageEvents();
  wireRoutineEvents();
  wireSettingsEvents();

  // timetable placement (after DOM settled)
  requestAnimationFrame(()=>{
    try{ placeTimetableBlocks(); }catch(e){}
    try{ placeRoutineBlocks(); }catch(e){}
  });

  document.addEventListener('click', closeDropdownsOnOutsideClick, {once:true});
}

function closeDropdownsOnOutsideClick(e){
  if(addDropdownOpenFor && !e.target.closest('.dropdown')){
    addDropdownOpenFor = null; render();
  } else {
    document.addEventListener('click', closeDropdownsOnOutsideClick, {once:true});
  }
}

function wireAddButtons(root){
  root.querySelectorAll('[data-add-toggle]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.getAttribute('data-add-toggle');
      addDropdownOpenFor = addDropdownOpenFor===key ? null : key;
      render();
    });
  });
  root.querySelectorAll('[data-add-to-schedule]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const schId = btn.getAttribute('data-add-to-schedule');
      const code = btn.getAttribute('data-code');
      const section = btn.getAttribute('data-section');
      const sch = Store.getSchedule(schId);
      const result = Conflicts.addToSchedule(sch, code, section);
      addDropdownOpenFor = null;
      if(result.ok){ toast(`Added ${code} Section ${section} to ${sch.name}.`, 'success'); }
      else { toast(result.detail || 'Could not add section.', 'error'); }
      render();
    });
  });
  root.querySelectorAll('[data-add-create-new]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const code = btn.getAttribute('data-code');
      const section = btn.getAttribute('data-section');
      const name = prompt('Name your new schedule:', `Schedule ${Store.schedules.length+1}`);
      if(name===null) return;
      const sch = Store.createSchedule(name);
      const result = Conflicts.addToSchedule(sch, code, section);
      addDropdownOpenFor = null;
      if(result.ok) toast(`Created "${sch.name}" and added ${code} Section ${section}.`, 'success');
      else toast(result.detail,'error');
      render();
    });
  });
}

function wireUploadEvents(){
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('pdf-input');
  const chooseBtn = document.getElementById('choose-pdf-btn');
  if(!dz) return;
  chooseBtn.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) handlePdfFile(input.files[0]); });
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('drag');
    if(e.dataTransfer.files[0]) handlePdfFile(e.dataTransfer.files[0]);
  });
}

async function handlePdfFile(file){
  if(!Admin.isAdmin){
    toast('Only the admin can import course list PDFs.','error');
    return;
  }
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    toast('Unsupported file. Please upload a PDF.', 'error'); return;
  }
  const progWrap = document.getElementById('upload-progress');
  const fill = document.getElementById('upload-progress-fill');
  const status = document.getElementById('upload-status');
  const pageCount = document.getElementById('upload-page-count');
  progWrap.classList.remove('hidden');
  status.textContent = 'Reading PDF…';

  try{
    const {numPages, records, needsReview} = await parsePdf(file, Store.dayMap, (p,total)=>{
      status.textContent = `Parsing course information…`;
      pageCount.textContent = `Page ${p} / ${total}`;
      fill.style.width = Math.round((p/total)*100) + '%';
    });
    status.textContent = 'Grouping sections and validating…';
    await new Promise(r=>setTimeout(r,30));
    const grouped = groupRecordsIntoCourses(records, needsReview, Store.dayMap);

    Store.dataset = {
      fileName: file.name,
      pageCount: numPages,
      importedAt: Date.now(),
      courses: grouped.courses,
      needsReview,
      courseCount: grouped.courseCount,
      sectionCount: grouped.sectionCount,
      meetingCount: grouped.meetingCount
    };
    scrubDatasetFaculty(Store.dataset);
    await Store.saveDataset();
    Store.sharedSource = false;
    toast(`PDF processed: ${grouped.courseCount} courses. Open Settings → Publish dataset.json so all visitors can see them.`, 'success');
    navigate('settings');
  }catch(err){
    console.error(err);
    toast('Could not parse this PDF. It may be corrupted, empty, or unsupported. ' + (err.message||''), 'error');
    progWrap.classList.add('hidden');
  }
}

function wireCoursesEvents(){
  const search = document.getElementById('course-search');
  if(search){
    search.addEventListener('input', debounce(e=>{ courseFilters.q = e.target.value; courseFilters.limit=60; navigate('courses'); }, 200));

  wireAddButtons(document.getElementById('app'));

function wireScheduleRailEvents(){

  if(sel) sel.addEventListener('change', e=>{ Store.activeScheduleId = e.target.value || null; Store.saveActiveId(); render(); });
  const newBtn = document.getElementById('rail-new-schedule');

  document.querySelectorAll('[data-remove-item]').forEach(btn=>{

  const name = prompt('Name your new schedule:', `Schedule ${Store.schedules.length+1}`);
  if(name===null) return;
  Store.createSchedule(name);
  toast('Schedule created.', 'success');
  render();
}

  const importBtn = document.getElementById('import-share-btn');
  if(importBtn) importBtn.addEventListener('click', importShareCode);

  document.querySelectorAll('[data-share-schedule]').forEach(b=>b.addEventListener('click', ()=>shareSchedule(b.getAttribute('data-share-schedule'))));
  document.querySelectorAll('[data-undo-schedule]').forEach(b=>b.addEventListener('click', ()=>{ if(undoSchedules()) render(); }));

async function exportElementAsPng(el, filename){
  if(!el){ toast('Nothing to export.','error'); return; }
  if(typeof html2canvas !== 'function'){
    toast('PNG export library failed to load. Check your connection.','error');
    return;
  }
  try{
    toast('Rendering PNG…');
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const bg = isDark ? '#1A1F2B' : '#FFFFFF';
    const canvas = await html2canvas(el, {
      backgroundColor: bg,
      scale: 2.5,
      useCORS: true,
      logging: false,
      onclone: (doc, cloned) => {
        // Cleaner export: hide buttons, enlarge timetable typography
        cloned.querySelectorAll('button, .btn').forEach(b=> b.style.display = 'none');
        cloned.classList.add('tt-export-mode');
        cloned.querySelectorAll('.timetable, .tt-block, .tt-gap').forEach(n=> n.classList.add('tt-export-mode'));
        const wrap = cloned.querySelector('.timetable-wrap') || cloned;
        wrap.style.overflow = 'visible';
        doc.querySelectorAll('[style]').forEach(node=>{
          const s = node.getAttribute('style') || '';
          if(/color-mix|oklch|oklab|lab\(|lch\(|color\(/i.test(s)){
            node.removeAttribute('style');
          }
        });
      }
    });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast('PNG downloaded.','success');
  }catch(err){
    console.error(err);
    toast('Could not export PNG. '+ (err.message||''),'error');
  }
}

function exportSchedulePng(id){
  const root = document.getElementById('schedule-export-root') || document.querySelector(`[data-schedule-export="${id}"]`);
  const s = Store.getSchedule(id);
  const name = (s && s.name ? s.name : 'schedule').replace(/[^a-z0-9]+/gi,'_');
  exportElementAsPng(root, name + '.png');
}

function exportScheduleCsv(id){
  const s = Store.getSchedule(id);
  if(!s) return;
  let rows = [['Course','Section','Faculty','Day','Start','End','Room']];
  s.items.forEach(item=>{
    const sec = Store.getSection(item.courseCode, item.sectionNumber);
    if(!sec) return;
    sec.meetings.forEach(m=>{
      rows.push([item.courseCode, sec.sectionNumber, sec.faculty||'', m.day, formatMinutes(m.start), formatMinutes(m.end), m.room||'']);
    });
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${s.name.replace(/[^a-z0-9]+/gi,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function wireRoutineEvents(){
  const dz = document.getElementById('routine-dropzone');
  const input = document.getElementById('routine-file-input');
  const btn = document.getElementById('routine-choose-btn');
  if(btn && input) btn.addEventListener('click', ()=>input.click());
  if(input) input.addEventListener('change', ()=>{ if(input.files[0]) handleRoutineFile(input.files[0]); });
  if(dz){
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleRoutineFile(e.dataTransfer.files[0]);
    });
  }
  const pngBtn = document.getElementById('routine-export-png');
  if(pngBtn) pngBtn.addEventListener('click', ()=>{
    const root = document.getElementById('routine-export-root');
    exportElementAsPng(root, 'weekly_routine.png');
  });
}

function wireSettingsEvents(){
  const loginBtn = document.getElementById('admin-login');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('admin-password');
    const result = await Admin.login(input ? input.value : '');
    if(result.ok){
      toast('Admin unlocked.','success');
      navigate('settings');
    } else {
      toast(result.reason || 'Login failed.','error');
    }
  });
  const pwInput = document.getElementById('admin-password');
  if(pwInput) pwInput.addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('admin-login')?.click();
  });
  const logoutBtn = document.getElementById('admin-logout');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
    await Admin.logout();
    toast('Logged out of admin.');
    navigate('dashboard');
  });
  const changeBtn = document.getElementById('admin-change-password');
  if(changeBtn) changeBtn.addEventListener('click', async ()=>{
    const cur = document.getElementById('admin-pw-current');
    const neu = document.getElementById('admin-pw-new');
    const conf = document.getElementById('admin-pw-confirm');
    const result = await Admin.changePassword(
      cur ? cur.value : '',
      neu ? neu.value : '',
      conf ? conf.value : ''
    );
    if(!result.ok){
      toast(result.reason || 'Could not change password.','error');
      return;
    }
    if(cur) cur.value = '';
    if(neu) neu.value = '';
    if(conf) conf.value = '';
    Admin.downloadConfig(result.hash);
    toast('Password updated on this device. admin-config.json downloaded — upload it next to index.html on your host.','success');
    navigate('settings');
  });
  const dlCfg = document.getElementById('admin-download-config');
  if(dlCfg) dlCfg.addEventListener('click', ()=>{
    Admin.downloadConfig();
    toast('Downloaded admin-config.json','success');
  });
  const publishBtn = document.getElementById('publish-dataset');
  if(publishBtn) publishBtn.addEventListener('click', ()=> exportPublishedDataset());

  const saveBtn = document.getElementById('save-daymap');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    if(!Admin.isAdmin) return;
    document.querySelectorAll('[data-daymap-letter]').forEach(sel=>{
      Store.dayMap[sel.getAttribute('data-daymap-letter')] = sel.value;
    });
    Store.saveDayMap();
    toast('Day mapping saved. Re-import your PDF for changes to take effect.', 'success');
  });
  const clearBtn = document.getElementById('clear-dataset');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!Admin.isAdmin) return;
    if(!confirm('Clear the local dataset cache? Shared dataset.json on the host is not deleted.')) return;
    Store.dataset = null;
    Store.sharedSource = false;
    await Persist.del('dataset:meta'); await Persist.del('dataset:courses'); await Persist.del('dataset:needsReview');
    navigate('upload');
  });
}

(async function init(){
  document.getElementById('app').innerHTML = `<div class="empty-state" style="margin-top:120px;"><h3>Loading EWU Course Planner…</h3></div>`;
  // Restore theme early to avoid flash
  try{
    const savedTheme = await Persist.get('ui:theme');
    if(savedTheme === 'dark' || savedTheme === 'light') applyTheme(savedTheme);
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
  }catch(e){}
  await Admin.restore();
  await Store.loadAll();
  render();
})();
</script>
